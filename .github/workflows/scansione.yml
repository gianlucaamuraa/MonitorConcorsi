# Scansione automatica ogni mattina + pubblicazione della pagina su GitHub Pages.
# Si può avviare anche a mano: scheda "Actions" → "Scansione concorsi" → "Run workflow".
name: Scansione concorsi

on:
  schedule:
    - cron: "15 5 * * *"      # 05:15 UTC = 06:15 (ora solare) / 07:15 (ora legale) in Italia
  workflow_dispatch:

permissions:
  contents: write              # per salvare i risultati nel repository
  pages: write
  id-token: write

concurrency:
  group: scansione
  cancel-in-progress: false

jobs:
  scansione:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.pubblica.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: pip install -r requirements.txt

      # Tailscale senza toccare la rete del server: offre solo un proxy locale
      # che esce dall'iPhone (exit node). Lo usano solo le fonti con
      # "via_italia: true". Se l'iPhone non risponde, quelle fonti falliscono
      # e il resto della scansione va avanti.
      - name: Collega Tailscale (uscita in Italia dal cellulare)
        continue-on-error: true
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          TS_EXIT_NODE: iphone173
        run: |
          if [ -z "$TS_AUTHKEY" ]; then echo "Secret TS_AUTHKEY mancante"; exit 1; fi
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo nohup tailscaled --tun=userspace-networking --state=mem: \
            --outbound-http-proxy-listen=localhost:1056 > /tmp/tailscaled.log 2>&1 &
          sleep 5
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname=github-scansione \
            --exit-node="$TS_EXIT_NODE" --timeout=60s
          sudo tailscale status
          # Prova: da dove esce il proxy? (loc=IT se passa dall'iPhone)
          paese=$(curl -s --max-time 30 -x http://localhost:1056 \
            https://www.cloudflare.com/cdn-cgi/trace | grep '^loc=' || true)
          echo "Uscita del proxy: ${paese:-nessuna risposta}"
          if [ "$paese" != "loc=IT" ]; then echo "Il proxy non esce dall'Italia"; exit 1; fi
          echo "PROXY_ITALIA=http://localhost:1056" >> "$GITHUB_ENV"

      - name: Scansiona le fonti
        run: python main.py scan
        env:
          MONITOR_PUBBLICO: "1"     # nei file pubblicati non finiscono stato e note
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Salva i risultati nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Scansione del $(date -u +%Y-%m-%d)"
          git push

      - name: Scollega Tailscale
        if: always()
        continue-on-error: true
        run: command -v tailscale >/dev/null && sudo tailscale logout || true

      - name: Prepara la cartella del sito
        run: python main.py sito

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito
      - id: pubblica
        uses: actions/deploy-pages@v4
