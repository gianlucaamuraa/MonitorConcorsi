# Aggiunge una fonte dalla versione online: controlla il link e, se funziona,
# lo salva in fonti.yaml. Si avvia dalla pagina (pulsante "Aggiungi fonte")
# oppure da: scheda "Actions" → "Aggiungi fonte" → "Run workflow".
# L'esito (aggiunta o motivo del rifiuto) compare nel riepilogo dell'esecuzione.
name: Aggiungi fonte

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Link della pagina con l'elenco dei bandi"
        required: true
      ente:
        description: "Nome dell'ente (facoltativo: altrimenti il titolo della pagina)"
        required: false
      sede:
        description: "Sede di lavoro (facoltativo, es. Sassari)"
        required: false

permissions:
  contents: write

concurrency:
  group: fonti
  cancel-in-progress: false

jobs:
  aggiungi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # I valori arrivano come variabili d'ambiente, non dentro il comando:
      # così un testo con virgolette o comandi non può essere eseguito
      - name: Controlla il link e aggiungilo
        env:
          URL: ${{ inputs.url }}
          ENTE: ${{ inputs.ente }}
          SEDE: ${{ inputs.sede }}
        run: python main.py aggiungi "$URL" --ente "$ENTE" --sede "$SEDE"

      - name: Salva fonti.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fonti.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Nuova fonte: ${URL:0:150}"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
        env:
          URL: ${{ inputs.url }}
