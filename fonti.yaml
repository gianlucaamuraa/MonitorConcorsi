# ============================================================
# MonitorConcorsi — Fonti da scansionare
# ============================================================
#
# Campi comuni:
#   nome       identificativo unico (minuscolo, senza spazi)
#   tipo       inpa | gazzetta | html | rss
#   attivo     true/false (default true)
#   ufficiale  true = sito dell'ente/istituzione, false = aggregatore (default true)
#
# Tipo "html" (pagina di un ente con l'elenco dei bandi):
#   url        indirizzo della pagina
#   ente       nome dell'ente da mostrare
#   sede       sede di lavoro (es. "Sassari")
#   selettore  (opzionale) selettore CSS della zona con l'elenco, es. "main"
#   blocco     (opzionale) selettore CSS di un riquadro che contiene un solo bando
#   ente_dal_contesto (opzionale, con blocco) legge l'ente dal testo sopra il riquadro
#   filtro     (opzionale) regex: il testo del link deve contenerla
#   escludi    (opzionale) regex: testi dei link da ignorare
#   escludi_link (opzionale) regex: indirizzi dei link da ignorare
#   sottomenu_di (opzionale) parte dell'indirizzo di una voce di menu: si leggono
#              solo i link del suo sottomenu
#   dettagli   (opzionale) true per gli elenchi senza date: apre la pagina dei
#              bandi senza scadenza (al massimo max_dettagli, default 10)
#   max_giorni_pubblicazione (opzionale) senza scadenza, scarta le voci
#              pubblicate da più di N giorni (pagine di notizie)
#   verifica_ssl (opzionale) false se il certificato del sito è intestato male
#   Nell'url si può scrivere {anno}: diventa l'anno in corso.
#
# Tipo "rss": url del feed, più ente/sede come sopra.
#
# Per provare una sola fonte:   python main.py scan --fonte nome_fonte
#
# Tutte le fonti qui sotto sono state verificate il 25/10/2026: pagina
# raggiungibile, robots.txt che ne permette la lettura, contenuto sui concorsi.
# Una fonte senza bandi aperti in quel momento è normale (esito "vuoto").
# ============================================================
fonti:
  # --- Fonti principali (con API/feed strutturati) ---------------------------

  # Portale InPA: dal 2023 tutte le PA vi pubblicano i concorsi.
  # Tiene i bandi in Sardegna (equivale al filtro regioneId=14 del sito) e quelli
  # nazionali (sedi in 5+ regioni). La pagina inpa.gov.it/bandi-e-avvisi carica
  # i dati con JavaScript: per questo si usa l'API che c'è dietro.
  - nome: inpa
    tipo: inpa
    includi_nazionali: true
    dettagli: true          # scarica i requisiti dei bandi nuovi (più lento, più preciso)

  # Gazzetta Ufficiale 4ª Serie Speciale (esce martedì e venerdì).
  # La pagina "30giorni/concorsi" contiene solo PDF: il feed RSS ha gli stessi atti.
  - nome: gazzetta_ufficiale
    tipo: gazzetta
    includi_nazionali: true

  # --- Enti di Sassari ----------------------------------------------------------

  - nome: citta_metropolitana_ss
    tipo: html
    url: "https://www.cittametropolitana.ss.it/it/argomenti/concorsi"
    ente: "Città Metropolitana di Sassari"
    sede: "Sassari"

  - nome: uniss_pta
    tipo: html
    url: "https://www.uniss.it/it/bandi-pta"
    ente: "Università di Sassari"
    sede: "Sassari"

  # --- Enti regionali -------------------------------------------------------------

  # Selezioni tramite Centri per l'impiego per altre PA (art. 16 L. 56/1987)
  - nome: aspal_art16
    tipo: html
    url: "https://agenziaregionaleperillavoro.regione.sardegna.it/index.php?c=93504&c1=4920&nodesc=2&s=44&tipoconc=2&tipodoc=2&v=9&xsl=2362"
    ente: "ASPAL - Agenzia Regionale per il Lavoro"
    sede: "Sardegna"

  - nome: aspal_avvisi
    tipo: html
    url: "https://www.aspalsardegna.it/tipi_notizia/avvisi-pubblici/"
    ente: "ASPAL - Agenzia Regionale per il Lavoro"
    sede: "Sardegna"

  # Concorsi e selezioni di ASPAL stessa e dell'Agenzia Forestas (stessa pagina
  # dell'art. 16, altra categoria)
  - nome: aspal_concorsi
    tipo: html
    url: "https://agenziaregionaleperillavoro.regione.sardegna.it/index.php?xsl=2362&s=44&v=9&c=93502&nodesc=2&c1=4920&tipodoc=2&tipoconc=1"
    ente: "ASPAL - Agenzia Regionale per il Lavoro"
    sede: "Sardegna"

  # ARES Sardegna gestisce anche i concorsi della ASL n. 1 di Sassari:
  # la pagina concorsi dell'ASL rimanda qui.
  - nome: ares_sardegna
    tipo: html
    url: "https://www.aressardegna.it/albo-pretorio/bandi-di-concorso-e-selezione/"
    ente: "ARES Sardegna"
    sede: "Sardegna"

  - nome: areus
    tipo: html
    url: "https://www.areus.sardegna.it/albo-pretorio/bandi-di-concorso-e-selezione/"
    ente: "AREUS Sardegna"
    sede: "Sardegna"

  # La pagina "Selezioni Aperte" di abbanoa.it non contiene l'elenco: lo carica
  # dalla piattaforma Intervieweb. Si legge quindi l'elenco direttamente da lì
  # (k = codice pubblico di Abbanoa, preso dalla pagina). Gli annunci si
  # chiamano "N. 2 Addetti ... - RIF. 12/26": il filtro cerca "RIF.".
  - nome: abbanoa_aperte
    tipo: html
    url: "https://abbanoa.intervieweb.it/app.php?module=iframeAnnunci&lang=it&k=3e4ae650fea2042033104c8a854d2c65&d=www.abbanoa.it&act1=23&defgroup=date&gnavenable=1&desc=1&annType=published&typeView=large"
    ente: "Abbanoa"
    sede: "Sardegna"
    filtro: "\\bRIF\\.|selezion|avviso"

# ============================================================
# Fonti tolte il 03/11/2026 (elenco ridotto alle fonti scelte)
# ============================================================
# - Raccolta concorsi regionali del Comune di Sassari, AOU Sassari, ATP Sassari
# - 43 siti di Comuni e Unioni della provincia di Sassari (22 richiedevano
#   Tailscale): i loro concorsi sono comunque pubblicati su InPA
# - Forestas (pagina ASPAL dedicata), Agenzia delle Entrate, AdER, MIT
# - Aggregatori ossian.cloud e concorsipubblici.com: ripetevano i bandi InPA
